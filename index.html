<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#17181d" />
    <title>Siegebound — Physics Prototype</title>
    <style>
      :root { --safe-area-top: env(safe-area-inset-top, 0px); --safe-area-right: env(safe-area-inset-right, 0px); --safe-area-bottom: env(safe-area-inset-bottom, 0px); --safe-area-left: env(safe-area-inset-left, 0px); }
      html, body { margin: 0; width: 100%; height: 100%; background: #17181d; overscroll-behavior: none; }
      body { display: grid; place-items: center; overflow: hidden; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
      #game { width: 100vw; height: 100vh; }
      canvas { display: block; width: 100% !important; height: 100% !important; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
